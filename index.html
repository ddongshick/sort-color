<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 마이크로비트 색상 분류기</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
    
    <style>
        :root {
            --primary: #6366f1;
            --bg-color: #0f172a; --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc; --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: var(--text-main); min-height: 100vh;
            display: flex; flex-direction: column; align-items: center; padding: 40px 20px;
        }
        h1 {
            font-size: 2.5rem; font-weight: 800; margin-bottom: 5px;
            background: linear-gradient(to right, #a855f7, #3b82f6);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        p.subtitle { color: var(--text-muted); margin-bottom: 30px; font-size: 1.1rem; }
        .container {
            background: var(--card-bg); backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px;
            padding: 40px; width: 100%; max-width: 900px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: grid; grid-template-columns: 1fr 1fr; gap: 40px;
        }
        .control-panel { display: flex; flex-direction: column; gap: 20px; }
        .input-group { display: flex; flex-direction: column; gap: 8px; }
        .input-group label { font-size: 0.9rem; font-weight: 600; color: var(--text-muted); }
        input[type="text"] {
            width: 100%; padding: 14px 16px; background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 12px;
            color: white; font-size: 1rem; transition: all 0.3s ease;
        }
        input[type="text"]:focus {
            outline: none; border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.3);
        }
        button {
            padding: 14px 24px; border: none; border-radius: 12px;
            font-size: 1rem; font-weight: 600; color: white; cursor: pointer;
            transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-ai { background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); box-shadow: 0 4px 14px 0 rgba(59,130,246,0.39); }
        .btn-bt { background: linear-gradient(135deg, #10b981 0%, #059669 100%); box-shadow: 0 4px 14px 0 rgba(16,185,129,0.39); }
        .btn-test { background: linear-gradient(135deg, #a855f7 0%, #7e22ce 100%); box-shadow: 0 4px 14px 0 rgba(168,85,247,0.39); }
        .btn-disabled { opacity: 0.5; cursor: not-allowed; pointer-events: none; }
        .status-box {
            padding: 16px; border-radius: 12px; background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05); font-size: 0.95rem; line-height: 1.5;
        }
        .indicator {
            display: inline-block; width: 10px; height: 10px;
            border-radius: 50%; margin-right: 8px; background-color: #ef4444;
        }
        .status-box.connected .indicator { background-color: #10b981; box-shadow: 0 0 10px #10b981; }
        .status-box.working .indicator { background-color: #f59e0b; box-shadow: 0 0 10px #f59e0b; animation: pulse 1s infinite alternate; }
        @keyframes pulse { from { opacity: 0.5; } to { opacity: 1; } }
        .view-panel { display: flex; flex-direction: column; align-items: center; gap: 20px; }
        #webcam-container {
            width: 100%; aspect-ratio: 1; max-width: 350px; background: rgba(0,0,0,0.4);
            border-radius: 20px; overflow: hidden; display: flex; align-items: center; justify-content: center;
            border: 2px dashed rgba(255,255,255,0.2);
        }
        #webcam-container canvas { width: 100% !important; height: 100% !important; object-fit: cover; border-radius: 18px; }
        .webcam-placeholder { color: var(--text-muted); font-weight: 600; }
        #label-container { width: 100%; display: flex; flex-direction: column; gap: 12px; }
        .class-row { display: flex; flex-direction: column; gap: 6px; }
        .class-info { display: flex; justify-content: space-between; font-size: 0.9rem; font-weight: 600; }
        .progress-bar-bg { width: 100%; height: 10px; background: rgba(255,255,255,0.1); border-radius: 5px; overflow: hidden; }
        .progress-bar-fill {
            height: 100%; width: 0%; background: var(--primary);
            border-radius: 5px; transition: width 0.15s ease-out;
        }
        .progress-bar-fill.highlight { background: linear-gradient(90deg, #a855f7, #3b82f6); box-shadow: 0 0 10px rgba(168,85,247,0.5); }
        @media (max-width: 768px) { .container { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <h1>AI Color Sorter</h1>
    <p class="subtitle">개발자 커스텀 통신주소 완벽 복원 + 버그 수정 최종본</p>

    <div class="container">
        <div class="control-panel">
            <div class="input-group">
                <label for="model-url">Teachable Machine 모델 URL</label>
                <input type="text" id="model-url" placeholder="https://teachablemachine.withgoogle.com/models/XXXXXXX/">
            </div>

            <button class="btn-ai" onclick="initModel()" id="btn-init">
                1. AI 모델 & 카메라 켜기
            </button>

            <button class="btn-bt" onclick="connectBluetooth()" id="btn-bt">
                2. 마이크로비트 블루투스 연결
            </button>
            
            <button class="btn-test" onclick="forceTest()">
                3. 강제 테스트 (RED 신호 쏘기)
            </button>

            <div class="status-box" id="status-box">
                <div style="margin-bottom: 8px;"><strong>Bluetooth 상태</strong></div>
                <div id="bt-log"><span class="indicator"></span>대기 중...</div>
                <div style="margin-top: 15px; margin-bottom: 8px;"><strong>동작 제어 상태</strong></div>
                <div id="cmd-log" style="color: var(--text-muted); font-size: 0.9rem; background:rgba(0,0,0,0.5); padding:8px; border-radius:6px;">초기화 완료 (명령 대기중)</div>
            </div>
        </div>

        <div class="view-panel">
            <div id="webcam-container">
                <div class="webcam-placeholder" id="webcam-placeholder">카메라 화면 준비 중...</div>
            </div>
            <div id="label-container"></div>
        </div>
    </div>

    <script>
        const UART_SERVICE_UUID    = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
        const UART_RX_CHAR_UUID    = "6e400003-b5a3-f393-e0a9-e50e24dcca9e"; // 기존 개발자 설정 그대로 0003

        let model, webcam, labelContainer, maxClasses;
        let rxCharacteristic;
        let isCoolingDown = false;

        // ── 1. AI 모델 & 카메라 초기화 ──────────────────────────────────
        async function initModel() {
            const URL = document.getElementById("model-url").value.trim();
            if (!URL) { alert("Teachable Machine 모델 URL을 입력해주세요!"); return; }

            const baseUrl  = URL.endsWith("/") ? URL : URL + "/";
            const btnInit  = document.getElementById("btn-init");
            btnInit.innerHTML = "모델 불러오는 중...";
            btnInit.classList.add("btn-disabled");

            try {
                model = await tmImage.load(baseUrl + "model.json", baseUrl + "metadata.json");
                maxClasses = model.getTotalClasses();

                webcam = new tmImage.Webcam(350, 350, true); // flip=true
                await webcam.setup();
                await webcam.play();
                window.requestAnimationFrame(loop);

                const container = document.getElementById("webcam-container");
                document.getElementById("webcam-placeholder").style.display = "none";
                container.style.border = "none";
                container.appendChild(webcam.canvas);

                labelContainer = document.getElementById("label-container");
                labelContainer.innerHTML = "";
                for (let i = 0; i < maxClasses; i++) {
                    const row = document.createElement("div");
                    row.className = "class-row";
                    row.innerHTML = `
                        <div class="class-info">
                            <span class="class-name">Class ${i}</span>
                            <span class="class-prob">0.0%</span>
                        </div>
                        <div class="progress-bar-bg">
                            <div class="progress-bar-fill"></div>
                        </div>`;
                    labelContainer.appendChild(row);
                }

                btnInit.innerHTML = "AI 인식 작동 중 ✓";
            } catch (e) {
                console.error(e);
                alert("모델 로드 실패! 주소가 정확한지 확인해주세요.");
                btnInit.innerHTML = "1. AI 모델 & 카메라 켜기";
                btnInit.classList.remove("btn-disabled");
            }
        }

        async function loop() {
            webcam.update();
            await predict();
            window.requestAnimationFrame(loop);
        }

        // ── 2. 실시간 예측 ──────────────────────────────────────────────
        async function predict() {
            const prediction = await model.predict(webcam.canvas);
            let highestProb = 0, bestClass = "", bestIndex = -1;

            for (let i = 0; i < maxClasses; i++) {
                if (prediction[i].probability > highestProb) {
                    highestProb = prediction[i].probability;
                    bestClass   = prediction[i].className;
                    bestIndex   = i;
                }
            }

            for (let i = 0; i < maxClasses; i++) {
                const prob    = prediction[i].probability;
                const row     = labelContainer.childNodes[i];
                const bar     = row.querySelector(".progress-bar-fill"); // ✅ 수정된 핵심 부분
                row.querySelector(".class-name").innerText = prediction[i].className;
                row.querySelector(".class-prob").innerText = (prob * 100).toFixed(1) + "%";
                bar.style.width = (prob * 100).toFixed(1) + "%";

                if (i === bestIndex && highestProb > 0.70) {
                    bar.classList.add("highlight");
                } else {
                    bar.classList.remove("highlight");
                }
            }

            if (highestProb > 0.70 && !isCoolingDown) {
                sendSignal(bestClass);
            }
        }

        // ── 3. 블루투스 연결 ────────────────────────────────────────────
        async function connectBluetooth() {
            const statusBox = document.getElementById("status-box");
            const btLog     = document.getElementById("bt-log");
            const cmdLog    = document.getElementById("cmd-log");

            try {
                btLog.innerHTML = `<span class="indicator"></span>마이크로비트 찾는 중...`;

                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: "BBC micro:bit" }],
                    optionalServices: [UART_SERVICE_UUID]
                });

                device.addEventListener('gattserverdisconnected', () => {
                    statusBox.classList.remove("connected", "working");
                    btLog.innerHTML = `<span class="indicator"></span>블루투스 연결 끊어짐`;
                    rxCharacteristic = null;
                });

                const server  = await device.gatt.connect();
                const service = await server.getPrimaryService(UART_SERVICE_UUID);
                rxCharacteristic = await service.getCharacteristic(UART_RX_CHAR_UUID);

                statusBox.classList.add("connected");
                btLog.innerHTML  = `<span class="indicator"></span>마이크로비트 연결 완료!`;
                document.getElementById("btn-bt").innerHTML = "마이크로비트 연결됨 ✓";
                document.getElementById("btn-bt").classList.add("btn-disabled");
                cmdLog.innerHTML = `<span style="color:#10b981;font-weight:bold;">블루투스 연결됨! 신호 전송 준비 완료</span>`;

            } catch (error) {
                console.error(error);
                btLog.innerHTML = `<span class="indicator"></span>연결 취소 또는 실패`;
            }
        }

        // ── 4. 강제 테스트 ──────────────────────────────────────────────
        function forceTest() {
            sendSignal("RED");
        }

        // ── 5. 마이크로비트로 신호 전송 ─────────────────────────────────
        async function sendSignal(signalName) {
            const cmdLog = document.getElementById("cmd-log");

            if (!rxCharacteristic) {
                cmdLog.innerHTML = `<span style="color:#ef4444;font-weight:bold;">⚠️ 2번 [마이크로비트 연결] 버튼을 먼저 눌러주세요!</span>`;
                return;
            }

            if (signalName === "NOT" && window.lastSentSignal === "NOT") return;

            try {
                const data = new TextEncoder().encode(signalName + "\n");

                // 크롬 버전 무관하게 작동하는 3중 전송 시도
                try {
                    await rxCharacteristic.writeValueWithoutResponse(data);
                } catch (e1) {
                    try {
                        await rxCharacteristic.writeValueWithResponse(data);
                    } catch (e2) {
                        await rxCharacteristic.writeValue(data);
                    }
                }

                window.lastSentSignal = signalName;
                const statusBox = document.getElementById("status-box");

                if (signalName !== "NOT") {
                    isCoolingDown = true;
                    statusBox.classList.add("working");
                    cmdLog.innerHTML = `<span style="color:#10b981;font-weight:bold;">${signalName}</span> 전송 완료 ➔ 모터 작동 중...`;

                    setTimeout(() => {
                        isCoolingDown = false;
                        statusBox.classList.remove("working");
                        cmdLog.innerHTML = `대기 중... (새로운 색상 인식 대기)`;
                    }, 3500);
                } else {
                    cmdLog.innerHTML = `대기 상태 (<span style="color:#94a3b8;">NOT</span> 전송됨)`;
                }

            } catch (error) {
                console.error("전송 에러:", error);
                cmdLog.innerHTML = `<span style="color:#ef4444;font-weight:bold;">❌ 전송 에러: ${error.message}</span>`;
            }
        }
    </script>
</body>
</html>
